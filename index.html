<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="CSS/login.css"
    >

</head>


<body>

<div class="login-container">


    <img
        src="Images/Logo.png"
        class="logo"
    >


    <h1 class="login-title">
        Smart IT System
    </h1>


    <form
        id="loginForm"
        onsubmit="login(event)"
    >


        <div class="input-group">

            <input
                type="email"
                id="username"
                placeholder="Email"
                autocomplete="username"
                required
            >

        </div>


        <div class="input-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>


        <p
            id="error"
            class="error-message"
        ></p>


    </form>


    <p class="subtitle">
        IT Asset & Ticket Management
    </p>


</div>


<script src="JS/login.js"></script>

</body>

</html>
